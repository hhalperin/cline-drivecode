[package]
name = "cline-app"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.1", features = ["image-png", "tray-icon"] }
tauri-plugin-updater = "2"
# Kanban's notification controller had no backend to talk to because this was
# simply absent. Unlike the updater there is no single-owner resource to
# conflict over — notifications are per-call — so linking it is additive.
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["time"] }
rfd = "0.15"
# Sleep prevention while agents are working. Replaces the Electron host's
# powerSaveBlocker, whose loss would let the machine suspend mid-run — the
# exact scenario the product exists to let you walk away from.
keepawake = "0.6"

[dev-dependencies]
# `tauri::test` (mock_builder / get_ipc_response) lets a test invoke a command
# through the real IPC path against a mock runtime. That is the layer where an
# async command's machinery actually lives — the generated wrapper, `State<'_,
# T>` held across an await, the response channel — none of which is exercised by
# calling the inner function directly. Dev-only, so a release bundle never
# enables it.
tauri = { version = "2.11.1", features = ["test"] }

[target."cfg(unix)".dependencies]
# Only for SIGTERM in `kanban::terminate_child`. std::process::Child::kill is
# SIGKILL, which gives the runtime no chance to flush board state.
libc = "0.2"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
