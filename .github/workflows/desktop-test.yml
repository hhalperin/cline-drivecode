name: desktop-test

# Typecheck, test and (on demand) package the Tauri desktop app.
#
# This lane exists because there was none. Before it, `apps/examples/desktop-app`
# appeared in no workflow path filter, no workflow invoked `cargo` at all, and
# `@cline/code` had no `test` script — so its ~30 Rust tests and 46 vitest files
# ran only on a developer's machine. `desktop-publish.yml` is the sole workflow
# that builds the app, and it is workflow_dispatch-only and gated on
# `github.repository == 'cline/cline'`, so it never fires in a fork.
#
# That is how a capability-manifest bug survived nine PRs of green CI: green CI
# was never looking. The two Rust tests written specifically to guard the
# capability list had never executed in CI.

on:
    push:
        branches:
            - main
        # Duplicated verbatim under pull_request below. GitHub Actions does not
        # support YAML anchors in workflow files, so the two lists have to be
        # kept in sync by hand.
        paths:
            - "apps/examples/desktop-app/**"
            # The Rust host's CAPABILITIES list and the bridge's TS contract are
            # one invariant across two trees, and a test here reads contract.ts
            # directly. A change to either can break this lane without touching
            # apps/examples.
            - "apps/kanban/packages/desktop-bridge/**"
            - "apps/kanban/packages/desktop-tauri/**"
            - "package.json"
            - "bun.lock"
            - ".github/workflows/desktop-test.yml"
            - ".github/actions/setup-bun-workspace/**"
    # Deliberately unfiltered by base branch, matching kanban-test / sdk-test /
    # drive-ci: `branches: [main]` silently skips mid-stack PRs whose base is
    # another feature branch, and a PR with no checks reads as a PR that passed.
    # This app arrived through exactly such a stack.
    pull_request:
        paths:
            - "apps/examples/desktop-app/**"
            - "apps/kanban/packages/desktop-bridge/**"
            - "apps/kanban/packages/desktop-tauri/**"
            - "package.json"
            - "bun.lock"
            - ".github/workflows/desktop-test.yml"
            - ".github/actions/setup-bun-workspace/**"
    workflow_dispatch:
        inputs:
            force_packaged:
                description: Build the bundle and run the packaged smoke test
                type: boolean
                required: false
                default: false
    workflow_call:
        inputs:
            force_packaged:
                description: Build the bundle and run the packaged smoke test
                type: boolean
                required: false
                default: false

permissions:
    contents: read

concurrency:
    group: desktop-test-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

jobs:
    ts:
        runs-on: ubuntu-latest
        name: Desktop TypeScript
        timeout-minutes: 25
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun workspace
              uses: ./.github/actions/setup-bun-workspace
              with:
                  bun-version: "1.3.13"

            # @cline/{core,llms,shared,ui} resolve through their compiled dist/
            # with no source condition, so nothing below resolves until this runs.
            - name: Build SDK
              run: bun run build:sdk

            - name: Typecheck
              run: bun -F @cline/code typecheck

            # 45 files under webview/ and sidecar/. Scoped by `include` in
            # vitest.config.ts because scripts/ uses bun:test, not vitest.
            - name: Test webview and sidecar
              run: bun -F @cline/code test

            - name: Test release scripts
              run: bun -F @cline/code test:scripts

    rust:
        runs-on: ubuntu-latest
        name: Desktop Rust host
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # `apt-get update` first, or the pinned versions 404 against a stale
            # index. Recorded in apps/kanban/AGENTS.md for the same reason.
            - name: Install Tauri system libraries
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libgtk-3-dev \
                    libwebkit2gtk-4.1-dev \
                    libsoup-3.0-dev \
                    librsvg2-dev

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            # desktop-publish.yml deliberately refuses a Rust cache, because a
            # restored cache is attacker-controlled in the one job that can read
            # the Developer ID certificate. That reasoning is specific to the
            # signing job. This job holds no secrets and produces no artifact
            # anyone installs, so caching here is safe and is what keeps the lane
            # fast enough to gate every PR.
            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/examples/desktop-app/src-tauri

            # `tauri::generate_context!()` validates `frontendDist` and
            # `externalBin` at compile time, so both must exist before cargo
            # runs. A test job needs them to exist, not to be real — the actual
            # binary and frontend are built in the `packaged` job below. All
            # three paths are gitignored, so this touches nothing tracked.
            - name: Stub the build inputs tauri-build requires
              working-directory: apps/examples/desktop-app
              run: |
                  set -euo pipefail
                  triple="$(rustc -vV | awk '/^host: / { print $2 }')"
                  mkdir -p webview/out src-tauri/bin
                  echo '<!doctype html><title>stub</title>' > webview/out/index.html
                  printf '#!/bin/sh\nexit 0\n' > "src-tauri/bin/code-sidecar-${triple}"
                  chmod +x "src-tauri/bin/code-sidecar-${triple}"
                  echo "stubbed frontendDist and code-sidecar-${triple}"

            - name: Check (tests included, warnings denied)
              working-directory: apps/examples/desktop-app/src-tauri
              env:
                  RUSTFLAGS: "-D warnings"
              run: cargo check --tests

            - name: Test
              working-directory: apps/examples/desktop-app/src-tauri
              run: cargo test

    # The expensive half: a real `tauri build`, then the built binary launched
    # and observed. Gated rather than run on every PR — a Linux bundle has never
    # been produced in this repo, and the two jobs above are what gate review.
    packaged:
        name: Packaged app smoke
        runs-on: ubuntu-latest
        timeout-minutes: 60
        if: github.event_name == 'push' || inputs.force_packaged
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Tauri system libraries
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libgtk-3-dev \
                    libwebkit2gtk-4.1-dev \
                    libsoup-3.0-dev \
                    librsvg2-dev \
                    xvfb

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/examples/desktop-app/src-tauri

            - name: Setup Bun workspace
              uses: ./.github/actions/setup-bun-workspace
              with:
                  bun-version: "1.3.13"

            - name: Build SDK
              run: bun run build:sdk

            # `beforeBuildCommand` chains build:ui → next build → build:sidecar:bin,
            # so this one command produces the frontend, the sidecar binary and
            # the bundle. The citest config narrows bundle.targets to deb:
            # `targets: "all"` also builds an AppImage, which fetches linuxdeploy
            # mid-build and makes the test depend on a third-party download.
            - name: Build the bundle
              working-directory: apps/examples/desktop-app
              run: bunx tauri build --config src-tauri/tauri.citest.conf.json

            - name: Verify bundle shape
              run: bun -F @cline/code verify:bundle

            # The runtime child only spawns when the launch cwd is inside a git
            # checkout containing apps/kanban/src/cli.ts, and it needs bun on a
            # launchd-shaped PATH. See the test file for why both are required.
            - name: Launch and observe
              run: bun -F @cline/code test:packaged

            - name: Upload bundle on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-bundle-linux
                  path: apps/examples/desktop-app/src-tauri/target/release/bundle/deb/*.deb
                  if-no-files-found: ignore
                  retention-days: 7
